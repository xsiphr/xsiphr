name: generate trophy

on:
  schedule:
    - cron: "0 0 * * *"   # يشتغل كل يوم الساعة 12 بالليل UTC
  workflow_dispatch:        # يسمحلك تشغّله يدويًا من تبويب Actions

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: xsiphr
          output_path: trophy.svg
          theme: oldie
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy"
          git push
